<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrainerDeck - PC Trainer Library</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>TrainerDeck</h1>
    <div class="sub">PC Trainer Library + Linux Launcher</div>
    <div id="backend-status" class="backend-status">checking backends...</div>
  </header>

  <section class="search">
    <input id="game-search" type="text" placeholder="Search game e.g. Assassin's Creed Shadows" autocomplete="off" />
    <div id="game-results" class="game-results"></div>
  </section>

  <section id="detail" class="detail hidden">
    <div id="detail-art" class="detail-art"></div>
    <div id="detail-info" class="detail-info"></div>
    <div id="trainer-files" class="trainer-files"></div>
    <button id="download-btn" class="btn primary">Download Trainer</button>
    <div id="download-status" class="download-status"></div>
  </section>

  <section id="library" class="library">
    <h2>Trainer Library</h2>
    <div id="library-list" class="library-list"></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
